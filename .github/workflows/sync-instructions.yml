name: Sync shared AI instructions

on:
  push:
    branches:
      - main
    paths:
      - instruction-source/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: harc-api
            display_name: HARC API
          - repository: harc-fe
            display_name: HARC Frontend
          - repository: harc-gateway
            display_name: HARC Gateway
          - repository: harc-aspire-host
            display_name: HARC Aspire Host

    steps:
      - name: Checkout instruction source
        uses: actions/checkout@v5

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: harc-workspace/${{ matrix.repository }}
          token: ${{ secrets.INSTRUCTION_SYNC_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Copy shared instruction files
        shell: bash
        run: |
          set -euo pipefail

          target="target/.github/instructions"
          mkdir -p "$target"

          cp instruction-source/coding.instructions.md "$target/coding.instructions.md"
          cp instruction-source/architecture.instructions.md "$target/architecture.instructions.md"
          cp instruction-source/security.instructions.md "$target/security.instructions.md"
          cp instruction-source/documentation.instructions.md "$target/documentation.instructions.md"

      - name: Create or update synchronization PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.INSTRUCTION_SYNC_TOKEN }}
          path: target
          base: main
          branch: automation/sync-shared-instructions
          delete-branch: true
          commit-message: "chore: sync shared AI instructions"
          title: "chore: sync shared AI instructions"
          body: |
            ## Summary

            This automated PR synchronizes the shared AI instruction contexts from `harc-workspace/.github` so this project follows the current organization-wide engineering guidance.

            ## Target

            - Repository: **${{ matrix.display_name }}** (`${{ matrix.repository }}`)
            - Base branch: `main`
            - Source: `harc-workspace/.github/instruction-source`

            ## Changes

            The following shared contexts are synchronized:

            - `.github/instructions/coding.instructions.md`
            - `.github/instructions/architecture.instructions.md`
            - `.github/instructions/security.instructions.md`
            - `.github/instructions/documentation.instructions.md`

            ## Preserved

            - Project-specific `AGENTS.md` and `copilot-instructions.md` files are preserved.
            - Project-specific instruction files are preserved.
            - Application source code, dependencies, configuration, and secrets are not changed.

            ## Validation

            - The workflow only opens or updates this PR when file differences exist.
            - The synchronization step copies only the four shared instruction contexts listed above.
            - Application build and test commands are not run by this synchronization workflow.

            ## Review checklist

            - [ ] Shared instruction changes are applicable to this repository.
            - [ ] Project-specific instructions remain intact.
            - [ ] No application source code or secret was changed.

            This PR was generated automatically according to `instruction-source/pull-request.instructions.md`.
